<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Starlog Admin</title><link rel="icon" href="favicon.png"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="starlog.css"></head><body><div data-header="dashboard.html"></div><main class="wrap page"><section class="surface"><h1 style="font-size:24px">Starlog Admin</h1><p class="muted small mt-1">Admin access is enforced by the backend.</p></section><div class="grid grid-2 mt-3"><section class="surface"><h2 style="font-size:19px">Upload design</h2><form id="upload" class="mt-2"><div class="field"><label class="label">Category</label><select class="select" id="category" required></select></div><div class="field"><label class="label">Title</label><input class="input" id="title" required></div><div class="field"><label class="label">Description</label><textarea class="textarea" id="description"></textarea></div><div class="field"><label class="label">Package</label><select class="select" id="level"><option value="SIMPLE">Simple</option><option value="CLASSIC">Classic</option><option value="PREMIUM">Premium</option><option value="SUPA">Supa</option></select></div><div class="field"><label class="label">PNG or JPG/JPEG</label><input class="input" id="designFile" type="file" accept="image/png,image/jpeg" required></div><button class="btn btn-primary btn-block" id="uploadBtn">Upload Design</button></form></section><section class="surface"><h2 style="font-size:19px">Pending bank payments</h2><div id="payments" class="list mt-2"></div></section></div><section class="surface mt-3"><h2 style="font-size:19px">Hot Picks — 10 homepage slides</h2><p class="muted small mt-1">Upload one PNG/JPG image into each numbered slot. These images are stored in Supabase Storage and shown on the homepage.</p><div id="hotPickSlots" class="grid grid-2 mt-2"></div></section><section class="surface mt-3"><h2 style="font-size:19px">Customization requests</h2><div id="requests" class="list mt-2"></div></section><section class="surface mt-3"><h2 style="font-size:19px">Payout requests</h2><div id="payouts" class="list mt-2"></div></section></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="starlog.js"></script><script src="starlog-data.js"></script><script>document.addEventListener("DOMContentLoaded",async function(){if(!await sbUser()){location.href="login.html?next=admin.html";return}try{var cats=await apiFetch("/api/admin/categories");document.getElementById("category").innerHTML=cats.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>'}).join("");await refresh()}catch(e){toast(e.message,"error");return}document.getElementById("upload").onsubmit=async function(e){e.preventDefault();var btn=document.getElementById("uploadBtn"),file=document.getElementById("designFile").files[0];if(!file)return;var fd=new FormData();fd.append("category_id",document.getElementById("category").value);fd.append("title",document.getElementById("title").value.trim());fd.append("description",document.getElementById("description").value.trim());fd.append("complexity_level",document.getElementById("level").value);fd.append("file",file);var session=(await SB.auth.getSession()).data.session;btn.disabled=true;try{var r=await fetch(STARLOG_API+"/api/admin/designs/upload",{method:"POST",headers:{Authorization:"Bearer "+session.access_token},body:fd}),b=await r.json();if(!r.ok)throw new Error(b.detail||"Upload failed");toast("Design uploaded.","success");this.reset();await refresh()}catch(e){toast(e.message,"error")}btn.disabled=false};async function refreshHotPicks(){var host=document.getElementById("hotPickSlots");host.innerHTML=Array.from({length:10},function(_,i){return '<div class="surface"><p class="bold">Hot Pick '+(i+1)+'</p><input class="input mt-1" id="hpFile'+(i+1)+'" type="file" accept="image/png,image/jpeg"><input class="input mt-1" id="hpTitle'+(i+1)+'" placeholder="Slide title"><textarea class="textarea mt-1" id="hpDesc'+(i+1)+'" placeholder="Short description"></textarea><button class="btn btn-primary btn-sm mt-1" data-hp-upload="'+(i+1)+'">Upload / replace</button></div>'}).join("");document.querySelectorAll("[data-hp-upload]").forEach(function(b){b.onclick=async function(){var slot=b.dataset.hpUpload,file=document.getElementById("hpFile"+slot).files[0];if(!file){toast("Choose an image first.","error");return;}var fd=new FormData();fd.append("slot",slot);fd.append("title",document.getElementById("hpTitle"+slot).value.trim());fd.append("description",document.getElementById("hpDesc"+slot).value.trim());fd.append("file",file);var session=(await SB.auth.getSession()).data.session;b.disabled=true;try{var r=await fetch(STARLOG_API+"/api/admin/hot-picks/upload",{method:"POST",headers:{Authorization:"Bearer "+session.access_token},body:fd}),body=await r.json();if(!r.ok)throw new Error(body.detail||"Upload failed");toast("Hot Pick "+slot+" saved.","success");}catch(e){toast(e.message,"error")}b.disabled=false;}})}
async function refresh(){var ps=await apiFetch("/api/admin/payments"),rs=await apiFetch("/api/admin/custom-requests"),po=await apiFetch("/api/admin/payouts");document.getElementById("payments").innerHTML=ps.filter(function(p){return p.payment_method==="bank_transfer"&&p.payment_status==="Pending"}).map(function(p){return '<div class="surface"><p class="bold">#'+p.order_id.slice(0,8).toUpperCase()+'</p><p class="muted small">'+(p.profiles?p.profiles.full_name:"")+' · '+formatNaira(p.amount)+'</p><button class="btn btn-primary btn-sm mt-1" data-pay="'+p.id+'">Verify bank transfer</button></div>'}).join("")||'<p class="muted small">No pending bank transfers.</p>';document.querySelectorAll("[data-pay]").forEach(function(b){b.onclick=async function(){try{await apiFetch("/api/admin/payments/"+b.dataset.pay+"/verify",{method:"POST"});toast("Payment verified.","success");await refresh()}catch(e){toast(e.message,"error")}}});document.getElementById("requests").innerHTML=rs.map(function(r){return '<div class="surface"><p class="bold">#'+r.order_id.slice(0,8).toUpperCase()+' · '+r.status+'</p><p class="muted small">'+(r.profiles?r.profiles.full_name:"")+' — '+r.instructions+'</p><select class="select mt-1" data-req="'+r.id+'"><option>Pending</option><option>Reviewing</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div>'}).join("")||'<p class="muted small">No customization requests.</p>';document.querySelectorAll("[data-req]").forEach(function(sel){var row=rs.find(function(r){return r.id===sel.dataset.req});sel.value=row.status;sel.onchange=async function(){try{await apiFetch("/api/admin/custom-requests/"+sel.dataset.req,{method:"PATCH",body:JSON.stringify({status:sel.value})});toast("Request status updated.","success")}catch(e){toast(e.message,"error")}}});document.getElementById("payouts").innerHTML=po.map(function(p){return '<div class="surface"><p class="bold">'+(p.profiles?p.profiles.full_name:"")+' · '+formatNaira(p.amount)+' · '+p.status+'</p><p class="muted small">'+p.bank_name+' · '+p.account_number+' · '+p.account_name+'</p><button class="btn btn-gold btn-sm mt-1" data-payout="'+p.id+'">Process ₦1,000</button></div>'}).join("")||'<p class="muted small">No payout requests.</p>';document.querySelectorAll("[data-payout]").forEach(function(b){b.onclick=async function(){try{await apiFetch("/api/admin/payouts/"+b.dataset.payout+"/process",{method:"POST"});toast("Transfer initiated; final status comes from Paystack webhook.","success");await refresh()}catch(e){toast(e.message,"error")}}})}await refreshHotPicks();initReveal()})</script></body></html>
