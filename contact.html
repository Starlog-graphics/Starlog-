<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact Starlog — Support, Hours & FAQ</title>
<meta name="description" content="Reach the Starlog team by message, email, phone or WhatsApp, and read answers to the most common design questions." />
<meta property="og:title" content="Contact Starlog" />
<meta property="og:description" content="Talk to the Starlog team — we reply within one business day." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<link rel="icon" href="favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="starlog.css" />
</head>
<body>
<div data-header="contact.html"></div>

<main class="wrap page">
  <h1 class="reveal">Contact us</h1>
  <p class="muted mt-1 reveal">We reply within one business day.</p>

  <div class="split mt-2">
    <section class="surface reveal">
      <h2>Send a message</h2>
      <form class="mt-2" id="contactForm" novalidate>
        <div class="field">
          <label class="label" for="name">Name</label>
          <input class="input" id="name" placeholder="Amara Kane" />
          <p class="error hidden" data-err="name">Please enter your name.</p>
        </div>
        <div class="field">
          <label class="label" for="contact">Email Address</label>
          <input class="input" id="contact" placeholder="you@example.com" />
          <p class="error hidden" data-err="contact">Enter a valid email address.</p>
        </div>
        <div class="field">
          <label class="label" for="message">Message</label>
          <textarea class="textarea" id="message" data-autogrow maxlength="1000" placeholder="How can we help?"></textarea>
          <p class="error hidden" data-err="message">Please write a short message.</p>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submit">Send message</button>
      </form>
    </section>

    <aside>
      <div class="surface reveal" id="info"></div>
      <div class="surface mt-2 reveal">
        <h2>FAQ</h2>
        <div class="mt-2" id="faq"></div>
      </div>
    </aside>
  </div>

  <div class="mt-4 reveal" data-community></div>
</main>

<div data-footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="starlog.js"></script>
<script src="starlog-data.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async function () {
    var b = STARLOG_CONFIG.business;
    document.getElementById("info").innerHTML =
      "<h2>Business info</h2>" +
      '<div class="meta">' +
      '<div><span class="muted">Email</span><strong><a href="mailto:' + b.email + '">' + b.email + "</a></strong></div>" +
      '<div><span class="muted">Phone</span><strong><a href="tel:' + b.phone.replace(/\s/g, "") + '">' + b.phone + "</a></strong></div>" +
      '<div><span class="muted">Hours</span><strong>' + b.hours + "</strong></div>" +
      "</div>";

    var levels = await dbLevels();
    var faqs = [
      { q: "How much does a design cost?", a: "Pricing follows the design level: " + levels.map(function (l) { return l.label + " " + formatNaira(l.price); }).join(", ") + "." },
      { q: "Can I customize a design?", a: "Yes. After View Details, tap Order this design and send your customization notes and reference pictures." },
      { q: "When are my files delivered?", a: "Customized files are delivered to your dashboard, usually within 24 hours of payment." },
      { q: "How does the ₦1,000 reward work?", a: "Share your referral link and earn when a referred friend completes a verified first purchase." },
    ];
    document.getElementById("faq").innerHTML = faqs.map(function (f) {
      return "<details style=\"border-top:1px solid var(--line);padding:12px 0\"><summary class=\"bold\" style=\"cursor:pointer\">" +
        f.q + '</summary><p class="muted small mt-1">' + f.a + "</p></details>";
    }).join("");

    function showError(key, on) {
      document.querySelector('[data-err="' + key + '"]').classList.toggle("hidden", !on);
    }

    document.getElementById("contactForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var name = document.getElementById("name");
      var contact = document.getElementById("contact");
      var message = document.getElementById("message");
      var okName = name.value.trim().length >= 2;
      var okContact = isEmailAddress(contact.value);
      var okMsg = message.value.trim().length >= 5;
      showError("name", !okName);
      showError("contact", !okContact);
      showError("message", !okMsg);
      if (!okName || !okContact || !okMsg) return;

      var submit = document.getElementById("submit");
      submit.disabled = true;
      submit.textContent = "Sending…";
      var value = contact.value.trim();
      var res = await sendContactMessage({
        name: name.value.trim(),
        email: value.toLowerCase(),
        subject: "Website contact",
        message: message.value.trim(),
      });
      submit.disabled = false;
      submit.textContent = "Send message";
      if (res.error) { toast(res.error.message || "Could not send your message.", "error"); return; }
      document.getElementById("contactForm").reset();
      toast("Message sent — we'll be in touch soon.", "success");
    });


    initReveal();
  });
</script>
</body>
</html>
