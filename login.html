<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — Starlog Account Access</title>
<meta name="description" content="Log in to Starlog with your email address to access your designs and downloads." />
<meta property="og:title" content="Login — Starlog" />
<meta property="og:description" content="Sign in to Starlog with your email address." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<link rel="icon" href="favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="starlog.css" />
</head>
<body class="auth-body">
<div data-header="login.html" data-auth-header></div>

<main class="auth-main">
  <div class="auth-card">
    <h1 style="font-size:24px">Welcome back</h1>
    <p class="muted small mt-1">Log in with your email address.</p>

    <form class="mt-3" id="loginForm" novalidate>
      <div class="field">
        <label class="label" for="contact">Email Address</label>
        <input class="input" id="contact" name="contact" autocomplete="email" placeholder="you@example.com" />
        <p class="error hidden" data-err="contact">Enter a valid email address.</p>
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <div class="input-group">
          <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
          <button class="input-icon-btn" type="button" id="toggle" aria-label="Show password">Show</button>
        </div>
        <p class="error hidden" data-err="password">Enter your password.</p>
      </div>

      <div class="row">
        <label class="checkbox"><input type="checkbox" id="remember" /> Remember me</label>
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <div class="oauth-stack mt-3">
        <button class="btn btn-outline btn-block oauth-btn" type="button" id="googleBtn"><span class="oauth-icon" data-google-icon></span><span>Continue with Google</span></button>
        <div class="divider"><span>or</span></div>
      </div>

      <button class="btn btn-primary btn-block btn-lg mt-3" type="submit" id="submit">Login</button>
      <p class="hint center">Sign in securely with your email and password, or continue with Google.</p>
    </form>

    <p class="muted small center mt-3">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="starlog.js"></script>
<script src="starlog-data.js"></script>
<script>

  document.addEventListener("DOMContentLoaded", function () {
    var form = document.getElementById("loginForm");
    var contact = document.getElementById("contact");
    var password = document.getElementById("password");
    var toggle = document.getElementById("toggle");
    var submit = document.getElementById("submit");
    var next = query("next") || "home.html";
    document.querySelector("[data-google-icon]").innerHTML = ICONS.google;
    document.getElementById("googleBtn").addEventListener("click", async function(){ await sbOAuth("google", "home.html"); });


    toggle.addEventListener("click", function () {
      var show = password.type === "password";
      password.type = show ? "text" : "password";
      toggle.textContent = show ? "Hide" : "Show";
    });

    function showError(name, on) {
      document.querySelector('[data-err="' + name + '"]').classList.toggle("hidden", !on);
    }

    /* already signed in? go straight through */
    sbUser().then(function (user) { if (user) location.href = next; });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var okContact = isEmailAddress(contact.value);
      var okPassword = password.value.length > 0;
      showError("contact", !okContact);
      showError("password", !okPassword);
      if (!okContact || !okPassword) return;

      submit.disabled = true;
      submit.textContent = "Logging in…";
      var res = await sbSignInPassword(contact.value, password.value);
      if (res.error) {
        submit.disabled = false; submit.textContent = "Login"; toast(res.error.message, "error"); return;
      }
      await syncLocalUser();
      location.href = next;
    });
  });

</script>
</body>
</html>
