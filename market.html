<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Market — Search Premium Designs from ₦5,000 | Starlog</title>
<meta name="description" content="Search and filter thousands of premium Starlog templates: logos, flyers, posters, wedding designs, social media designs, banners, certificates, packaging and more." />
<meta property="og:title" content="Market — Starlog" />
<meta property="og:description" content="Search by name, category, subcategory or keyword, then filter by design level, price, newest or most popular." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="starlog.css" />
</head>
<body>
<div data-header="market"></div>

<main class="wrap page">
  <header class="reveal row">
    <div>
      <h1>Design Market</h1>
      <p class="muted mt-1" id="count"></p>
    </div>
    <a class="btn btn-gold" href="order.html?new=1">Order new</a>
  </header>


  <section class="surface mt-2 reveal">
    <div class="search search-wrap">
      <span id="searchIcon"></span>
      <input class="input" id="q" type="search" autocomplete="off" placeholder="Search designs, categories, keywords…" aria-label="Search designs" />
      <div class="suggestions hidden" id="suggest"></div>
    </div>

    <div class="chips mt-2 chips-scroll" id="cats"></div>
    <div class="chips mt-2 chips-scroll hidden" id="subs"></div>

    <div class="filter-row mt-3">
      <div class="field">
        <label class="label" for="sort">Sort by</label>
        <select class="select" id="sort">
          <option value="relevance">Best match</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="newest">Newest designs</option>
          <option value="popular">Most popular</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="level">Design level</label>
        <select class="select" id="level">
          <option value="All">All levels</option>
          <option value="SIMPLE">Simple — ₦5,000</option>
          <option value="CLASSIC">Classic — ₦6,300</option>
          <option value="PREMIUM">Premium — ₦9,500</option>
          <option value="SUPA">Supa — ₦12,000</option>
        </select>
      </div>
      <div class="field">
        <label class="label">&nbsp;</label>
        <button class="btn btn-outline btn-block" id="clear" type="button">Clear filters</button>
      </div>
    </div>
  </section>

  <section class="mt-4">
    <div class="grid grid-3" id="grid"></div>
    <div class="surface center hidden mt-2" id="empty">
      <p class="bold">No matching designs found</p>
      <p class="muted small mt-1">Try a different search term, category or filter.</p>
    </div>
  </section>

  <div class="mt-4 reveal" data-community></div>
</main>

<div data-footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="starlog.js"></script>
<script src="starlog-data.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("searchIcon").innerHTML = ICONS.search;

    var state = {
      category: query("category") || "All",
      sub: query("sub") || "All",
      q: query("q") || "",
      sort: "relevance",
      level: query("level") || "All",
    };

    var qInput = document.getElementById("q");
    var suggest = document.getElementById("suggest");
    var grid = document.getElementById("grid");
    var empty = document.getElementById("empty");
    var timer = null;
    qInput.value = state.q;

    function renderChips() {
      document.getElementById("cats").innerHTML = ["All"].concat(categoryNames()).map(function (c) {
        return '<button type="button" class="chip' + (state.category === c ? " active" : "") + '" data-cat="' + c + '">' + c + "</button>";
      }).join("");
      document.querySelectorAll("[data-cat]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.category = btn.getAttribute("data-cat");
          state.sub = "All";
          renderChips();
          renderGrid();
        });
      });

      var subs = document.getElementById("subs");
      var list = state.category === "All" ? [] : subcategoriesOf(state.category);
      subs.classList.toggle("hidden", list.length === 0);
      if (list.length) {
        subs.innerHTML = ["All"].concat(list).map(function (s) {
          return '<button type="button" class="chip sub' + (state.sub === s ? " active" : "") + '" data-sub="' + s + '">' + s + "</button>";
        }).join("");
        subs.querySelectorAll("[data-sub]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.sub = btn.getAttribute("data-sub");
            renderChips();
            renderGrid();
          });
        });
      }
    }

    function renderGrid() {
      grid.innerHTML = Array.from({ length: 6 }).map(function () {
        return '<div class="skeleton" style="height:300px"></div>';
      }).join("");
      empty.classList.add("hidden");
      liveSearch(state.q, state).then(function (list) {
        if (!list.length) {
          grid.innerHTML = noTemplatesHtml();
        } else {
          grid.innerHTML = list.map(designCardHtml).join("");
          wireDetailButtons(grid);
        }
        document.getElementById("count").textContent =
          list.length + " design" + (list.length === 1 ? "" : "s") +
          " across " + categoryNames().length + " categories";
      });
    }

    /* Suggestions come from the live result set, so nothing demo leaks in. */
    function renderSuggestions() {
      var term = state.q.trim();
      if (term.length < 2) {
        suggest.classList.add("hidden");
        suggest.innerHTML = "";
        return;
      }
      liveSearch(term, { sort: "relevance", limit: 6 }).then(function (items) {
        if (!items.length) {
          suggest.classList.add("hidden");
          suggest.innerHTML = "";
          return;
        }
        suggest.innerHTML = items.map(function (s, i) {
          return '<button type="button" class="suggestion" data-sug="' + i + '">' +
            "<span>" + s.title + '</span><span class="kind">' + (s.category || "Design") + "</span></button>";
        }).join("");
        suggest.classList.remove("hidden");
        suggest.querySelectorAll("[data-sug]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            suggest.classList.add("hidden");
            location.href = "order.html?id=" + items[Number(btn.getAttribute("data-sug"))].id;
          });
        });
      });
    }

    qInput.addEventListener("input", function () {
      state.q = qInput.value;
      window.clearTimeout(timer);
      timer = window.setTimeout(function () {
        renderSuggestions();
        renderGrid();
      }, 250);
    });
    document.addEventListener("click", function (e) {
      if (!suggest.contains(e.target) && e.target !== qInput) suggest.classList.add("hidden");
    });

    document.getElementById("sort").addEventListener("change", function (e) {
      state.sort = e.target.value;
      renderGrid();
    });
    document.getElementById("level").addEventListener("change", function (e) {
      state.level = e.target.value;
      renderGrid();
    });
    document.getElementById("clear").addEventListener("click", function () {
      state = { category: "All", sub: "All", q: "", sort: "relevance", level: "All" };
      qInput.value = "";
      document.getElementById("sort").value = "relevance";
      document.getElementById("level").value = "All";
      suggest.classList.add("hidden");
      renderChips();
      renderGrid();
    });

    document.getElementById("level").value = state.level;
    loadTaxonomy().then(renderChips);
    renderChips();
    renderGrid();
    initReveal();
  });
</script>
</body>
</html>
